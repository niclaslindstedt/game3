name: release

# THE RELEASE, END TO END. Normally CALLED by version-bump.yml — the one
# entry point a maintainer dispatches (OSS_GAME_SPEC §10.3) — and also
# dispatchable on its own as the break-glass, with the same `bump` input.
#
# What it does, in order: derive the semver bump from the changeset
# fragments in .changes/unreleased/ (their front-matter carries the
# Added/Changed/Fixed/... type and an optional `breaking: true` — see
# scripts/release/compute-bump.mjs), consume those fragments into a new
# CHANGELOG section, update every shipped version string via
# scripts/update-versions.sh, commit `chore(release): vX.Y.Z` to main, tag
# it, create the GitHub Release, then chain into pages.yml so the new tag is
# served at `/` (and the same code at `/preview/`, because main now matches
# the tag) without waiting for the next push.
#
# WHY THERE IS NO RELEASE_TOKEN. The spec's reference shape has version-bump
# push a `v*` tag with a PAT so that a `push: tags` trigger fires here; the
# PAT exists only because the default GITHUB_TOKEN suppresses downstream
# workflow triggers. This repository chains the two workflows with a
# `workflow_call` instead — one dispatched run, in which the commit, the tag,
# the GitHub Release and the Pages deploy all happen — so no cross-workflow
# trigger is needed, the default GITHUB_TOKEN is sufficient, and the tag is
# created exactly once, already on the release commit: there is nothing to
# force-push and no retag step. The sibling rally repo works the same way.
#
# `bump` defaults to `auto` — the fragment-derived bump above. Set it to an
# explicit patch/minor/major only to override that derivation.
#
# The release is created as a DRAFT and made public by the `publish` job at
# the bottom. Nothing is attached to it today; when the desktop shell
# (tauri/) arrives, its per-platform packaging matrix slots in between the
# two, so no player ever finds a release page whose download for their
# machine is missing.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump. 'auto' derives it from the .changes/unreleased/ fragments (breaking → major, Added/Changed/Removed/Deprecated → minor, Fixed/Security → patch). Pick patch/minor/major to override."
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
  workflow_call:
    inputs:
      bump:
        description: "Semver bump, resolved or 'auto' (see workflow_dispatch above)."
        required: false
        type: string
        default: auto

# Default to no permissions; every job declares its own least-privilege
# `permissions:` block.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # contents: write — this job pushes the release commit and the tag.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Verify clean working tree
        run: |
          if ! git diff --quiet || ! git diff --quiet --cached; then
            echo "::error::working tree is not clean — refusing to release"
            git status
            exit 1
          fi

      # Resolve the effective bump. `auto` (the default) derives it from
      # the changeset fragments' front-matter so the release needs no
      # human judgement; an explicit patch/minor/major from the dispatch
      # form overrides that derivation.
      - name: Resolve bump
        id: resolve
        env:
          REQUESTED: ${{ inputs.bump }}
        run: |
          if [ "$REQUESTED" = "auto" ] || [ -z "$REQUESTED" ]; then
            BUMP=$(node scripts/release/compute-bump.mjs)
            echo "Auto-derived bump from fragments: $BUMP"
          else
            BUMP="$REQUESTED"
            echo "Using requested bump override: $BUMP"
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      # Compute the next version from the highest released tag (not from
      # package.json, which could lag), then rewrite every shipped
      # version string — root + workspace package.json, the lockfile,
      # and engine/version.ts — via the script that owns them.
      - name: Bump version
        id: bump
        env:
          BUMP: ${{ steps.resolve.outputs.bump }}
        run: |
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          CURRENT="${LATEST_TAG#v}"
          CURRENT="${CURRENT:-0.0.0}"
          IFS=. read -r MAJOR MINOR PATCH <<<"$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
            *) echo "::error::unknown bump '$BUMP'"; exit 1 ;;
          esac
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::tag v${VERSION} already exists — refusing to release over it"
            exit 1
          fi
          ./scripts/update-versions.sh "v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped from ${LATEST_TAG:-nothing} to v${VERSION}"

      - name: Collate changelog
        run: node scripts/release/collate-changelog.mjs "${{ steps.bump.outputs.version }}"

      - name: Extract release-notes body
        run: |
          node scripts/release/extract-section.mjs "${{ steps.bump.outputs.version }}" > .release-notes.md
          cat >> .release-notes.md <<'NOTES'

          ---

          Play this release at https://game3.niclaslindstedt.se/ — it is an
          installable PWA (add it to your home screen) and works offline
          once loaded.
          NOTES

      - name: make build
        run: make build
      - name: make test
        run: make test

      - name: Commit + tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json pwa/package.json engine/version.ts CHANGELOG.md .changes/unreleased
          git commit -m "chore(release): v${VERSION}"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin HEAD:main
          git push origin "$TAG"

      # A DRAFT, and the `publish` job at the bottom is what makes it
      # public — once everything that belongs on it is attached.
      #
      # Idempotent on purpose: the tag is already pushed by the step above,
      # so a bare `gh release create` that fails (or a re-run after one did)
      # would leave a tagged version with no release at all. The edit
      # deliberately does NOT pass `--draft`, so re-running against a
      # release that is already public refreshes its notes instead of
      # retracting it.
      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating its notes."
            gh release edit "$TAG" --title "$TAG" --notes-file .release-notes.md
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file .release-notes.md
          fi

  # THE RELEASE BECOMES VISIBLE HERE, and nowhere else. Today nothing sits
  # between this and `release`; when a shell's packaging matrix does, this
  # job takes `needs: [release, desktop]` and the draft stays a draft until
  # every platform has attached its download.
  publish:
    needs: release
    runs-on: ubuntu-latest
    # contents: write — this is the flag flip on the release itself.
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "published asset: \(.name)"'

  # Chain straight into pages.yml so the new tag is served at `/`
  # immediately — without this, deployment would wait for the next
  # push to main.
  #
  # Deliberately `needs: release` and not `needs: publish`: the website IS
  # the game, it is built from the tag that already exists, and holding the
  # web deploy hostage to anything downstream would take the free-to-play
  # version down over a step nobody playing depends on.
  pages:
    needs: release
    uses: ./.github/workflows/pages.yml
    with:
      release_ref: ${{ needs.release.outputs.tag }}
    permissions:
      # pages.yml declares `contents: write` at the top level because its
      # assemble job force-pushes the /branch/ slot to the `branch-deploy`
      # orphan branch. A reusable workflow can't be granted fewer permissions
      # than it requests, so these must match or the whole release run fails
      # at startup before any job runs.
      contents: write
      pages: write
      id-token: write
    secrets: inherit
